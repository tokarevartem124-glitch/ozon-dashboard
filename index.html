    window.addDays = function(iso, delta){
      if(!iso) return null;
      const d = new Date(String(iso).slice(0,10) + "T00:00:00Z");
      if(Number.isNaN(d.getTime())) return String(iso).slice(0,10);
      d.setUTCDate(d.getUTCDate() + Number(delta || 0));
      return d.toISOString().slice(0,10);
    };

in-bottom:12px}.drawer-product-title .article{font-size:12px;color:#b9c6ff}.drawer .table-wrap{max-height:none}.drill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.drill-tab{border:1px solid var(--line);background:#121722;color:#aeb8cb;border-radius:9px;padding:6px 9px;cursor:pointer;font-size:12px}.drill-tab.active{background:#242c40;color:#fff;border-color:#46516b}@media(max-width:900px){.detail-drawer{width:100vw}.drawer-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.drawer-header{padding:12px}.drawer-body{padding:12px}.drawer-actions .btn:not(.drawer-close){display:none}}

<script>
/* ================================================================
   Ozon Seller Analytics — client-only dashboard
   Key blocks: state, parsing, joins/cost source, metrics, unit economy,
   auto-insights, plan/fact, funnel/growth signals, inventory, rendering.
   ================================================================ */

/* -------------------- business reference data: 1C --------------------
   Ozon operational and financial data is API-only.
   External reference data is joined by:
     1C `id товара` / `Id товара` -> Ozon `Артикул` (offer_id).
   The bundled files are a starting reference and can later be replaced by
   newer 1C exports without touching the Ozon API history.
----------------------------------------------------------------------- */
const STORAGE_KEY = 'ozonSellerDashboard.apiOnly.v4';
const BUSINESS_PERIOD_MIN = '2026-06-01';
const LEGACY_STORAGE_KEYS = ['ozonSellerDashboard.apiOnly.v1','ozonSellerDashboard.v4'];
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const charts = {};
let activeTab = 'overview';
let currentModel = null;
let tableState = {
  products:{search:'',category:'',sort:'revenue',dir:-1,page:1,pageSize:100,expanded:null},
  unit:{search:'',category:'',costSource:'',sort:'revenue',dir:-1,page:1,pageSize:100},
  stock:{search:'',category:'',sort:'daysToZero',dir:1,page:1,pageSize:100},
  orders:{search:'',sort:'deliveryDate',dir:-1,page:1,pageSize:100}
};

let drillStack=[];
let drillUI={search:'',category:'',sort:null,dir:-1,page:1,pageSize:100,mode:'all'};

const REFERENCE_DATA_URL='./data/1c-reference.json?v=2026-09-08';
let EMBEDDED_PACK=null;
const EMBEDDED_META = {"cost":{"id":"embedded-cost-1c-full-2026-09-07","embedded":true,"type":"cost","label":"Закупочные цены 1С","sheetName":"Лист 1","sourceName":"цены из 1с.xlsx","start":null,"end":null,"snapshot":"2026-09-07","importedAt":"2026-09-07T16:04:00+05:00","capabilities":{"cost":true,"idField":"id товара→Артикул Ozon","referenceIds":46199,"knownCost":38859,"missingCost":7336,"conflicts":4}},"rrp":{"id":"embedded-rrp-1c-full-2026-09-08","embedded":true,"type":"rrp","label":"Розничные цены 1С","sheetName":"Лист 1","sourceName":"export_2138349610 (45)(1).xlsx","start":null,"end":null,"snapshot":"2026-09-08","importedAt":"2026-09-08T14:40:00+05:00","capabilities":{"rrp":true,"idField":"Id товара→Артикул Ozon","referenceIds":46207,"knownRrp":46127,"missingRrp":80,"duplicates":0}}};
const EMBEDDED_IDS = [EMBEDDED_META.cost.id,EMBEDDED_META.rrp.id];

function unpackRows(pack){
  const f=pack.fields;
  return pack.rows.map(a=>{const o={};for(let i=0;i<f.length;i++)o[f[i]]=a[i];return o});
}
function makeEmbeddedDatasets(){
  if(!EMBEDDED_PACK?.cost||!EMBEDDED_PACK?.rrp)return [];
  return [
    {...EMBEDDED_META.cost,rows:unpackRows(EMBEDDED_PACK.cost)},
    {...EMBEDDED_META.rrp,rows:unpackRows(EMBEDDED_PACK.rrp)}
  ];
}
function installEmbeddedReferenceDatasets(){
  const rest=state.datasets.filter(d=>!d.embedded);
  const embedded=makeEmbeddedDatasets();
  state.datasets=[...embedded,...rest];
}
async function loadEmbeddedReferenceData(){
  if(EMBEDDED_PACK)return;
  const res=await fetch(REFERENCE_DATA_URL,{cache:'force-cache'});
  if(!res.ok)throw new Error(`Справочник 1С недоступен: HTTP ${res.status}`);
  const json=await res.json();
  if(json?.version!==1||!json?.pack?.cost||!json?.pack?.rrp)throw new Error('Повреждён справочник 1С');
  EMBEDDED_PACK=json.pack;
  installEmbeddedReferenceDatasets();
}
function disableEmbedded(list){
  state.disabledEmbedded = state.disabledEmbedded || [];
  for(const d of list||[]) if(d?.embedded && !state.disabledEmbedded.includes(d.id)) state.disabledEmbedded.push(d.id);
}
function datasetIdentity(d){
  return [d.type,d.sourceName,d.sheetName,d.start||'',d.end||'',d.snapshot||''].join('|');
}

const defaultHiredLogistics = () => ({
  '2026-06':{amount:32566,mode:'full',asOf:''},
  '2026-07':{amount:44133,mode:'full',asOf:''},
  '2026-08':{amount:38591,mode:'full',asOf:''},
  '2026-09':{amount:10082,mode:'asof',asOf:'2026-09-08'}
});
const defaultState = () => ({
  version:13,
  datasets:makeEmbeddedDatasets(),
  disabledEmbedded:[],
  manualCosts:{},
  plans:{},
  snapshots:[],
  activePeriod:'all',
  settings:{
    criticalDays:7,
    attentionDays:14,
    taxRate:22,
    taxMode:'usn_profit',
    adsActive:false,
    drrLow:7,
    drrHigh:15,
    repricerMonthly:21280,
    storeBonusMonthly:10000,
    hiredLogisticsByMonth:defaultHiredLogistics()
  }
});
let state = loadState();

function loadState(){
  const base=defaultState();
  try{
    let raw=localStorage.getItem(STORAGE_KEY);
    if(!raw)for(const k of LEGACY_STORAGE_KEYS){raw=localStorage.getItem(k);if(raw)break}
    if(!raw)return base;
    let json=raw;
    if(window.LZString){const dec=LZString.decompressFromUTF16(raw);if(dec)json=dec}
    const parsed=JSON.parse(json);
    const custom=(parsed.datasets||[]).filter(d=>['cost','rrp'].includes(d.type)&&!d.apiAuto&&!d.embedded);
    const embedded=makeEmbeddedDatasets();
    const mergedSettings={...base.settings,...(parsed.settings||{})};
    if(!Number.isFinite(+mergedSettings.taxRate))mergedSettings.taxRate=22;
    mergedSettings.taxMode='usn_profit';
    if(typeof mergedSettings.adsActive!=='boolean')mergedSettings.adsActive=false;
    mergedSettings.repricerMonthly=Number.isFinite(+mergedSettings.repricerMonthly)?+mergedSettings.repricerMonthly:21280;

/* ---------------------- automatic Ozon Seller API sync ----------------------
   GitHub Actions writes a slim encrypted data/ozon-dashboard.enc.json for the browser;
   the full data/ozon-data.enc.json remains only as workflow sync state. The API key never
   reaches the browser. The browser asks for DASHBOARD_KEY and decrypts the
   payload locally with a raw 256-bit AES-GCM key. If the remote file is unavailable or the password is wrong, Ozon KPI blocks stay unavailable; purchase costs remain local.
---------------------------------------------------------------------------- */
const API_DATA_URL='./data/ozon-dashboard.enc.json';
const API_STATUS_URL='./data/ozon-status.json';
const API_PW_SESSION='ozonDashboard.apiKey.session';
const API_PW_REMEMBER='ozonDashboard.apiKey.remember';
const API_CACHE_DB='ozonDashboard.fastCache.v1';

function b64bytes(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
function normalizeDashboardKey(v){return String(v??'').replace(/\s+/g,'').toLowerCase()}
function hexBytes(hex){const s=normalizeDashboardKey(hex);if(!/^[0-9a-f]{64}$/.test(s))throw new Error('DASHBOARD_KEY должен содержать ровно 64 hex-символа');const a=new Uint8Array(32);for(let i=0;i<32;i++)a[i]=parseInt(s.slice(i*2,i*2+2),16);return a}
async function gunzipBytes(bytes){
  if(typeof DecompressionStream==='undefined')throw new Error('Браузер не поддерживает gzip-декомпрессию. Обновите Chrome/Edge.');
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function decryptApiEnvelope(env,keyHex){
  if(env?.keyMode!=='RAW-HEX-256')throw new Error('Файл данных зашифрован старым форматом. Дождитесь нового workflow после перехода на DASHBOARD_KEY.');
  const key=await crypto.subtle.importKey('raw',hexBytes(keyHex),{name:'AES-GCM'},false,['decrypt']);
  const decrypted=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(env.iv),tagLength:128},key,b64bytes(env.data)));
  const plain=env.compression==='gzip'?await gunzipBytes(decrypted):decrypted;
  return JSON.parse(new TextDecoder().decode(plain));
}
function openApiCache(){return new Promise((resolve,reject)=>{const req=indexedDB.open(API_CACHE_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(API_CACHE_STORE))db.createObjectStore(API_CACHE_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function readApiCache(){
  try{const db=await openApiCache();return await new Promise((resolve,reject)=>{const tx=db.transaction(API_CACHE_STORE,'readonly');const req=tx.objectStore(API_CACHE_STORE).get(API_CACHE_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)})}catch(e){console.warn('Fast cache read:',e);return null}
}
async function writeApiCache(payload){
  try{const db=await openApiCache();await new Promise((resolve,reject)=>{const tx=db.transaction(API_CACHE_STORE,'readwrite');tx.objectStore(API_CACHE_STORE).put({payload,generatedAt:payload.generatedAt,savedAt:new Date().toISOString()},API_CACHE_KEY);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}catch(e){console.warn('Fast cache write:',e)}
}
async function clearApiCache(){try{const db=await openApiCache();await new Promise((resolve,reject)=>{const tx=db.transaction(API_CACHE_STORE,'readwrite');tx.objectStore(API_CACHE_STORE).delete(API_CACHE_KEY);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}catch(e){console.warn('Fast cache clear:',e)}}
function apiPasswordDialog(){

function applyApiPayload(payload,{fromCache=false,silent=false}={}){
  if(payload?.version!==4||!['ozon-api-only','ozon-api-plus-validated-supplements'].includes(payload?.sourcePolicy)){
    throw new Error(`Нужен payload v4 Seller API. Получено: version=${payload?.version??'?'}, source=${payload?.sourcePolicy??'?'}`);
  }
  if(!Array.isArray(payload?.datasets)||!payload.datasets.length)throw new Error('В файле автообновления нет наборов данных.');
  for(const d of payload.datasets){if(!d||!d.type||!Array.isArray(d.rows))throw new Error(`Повреждён набор API: ${d?.type||d?.id||'без типа'}`)}
  const selected=state.activePeriod;
  const previousDatasets=state.datasets;
  const previousStatus={...apiSyncStatus};
  const nextDatasets=state.datasets.filter(d=>['cost','rrp'].includes(d.type)&&!d.apiAuto);
  for(const d of payload.datasets)nextDatasets.push({...d,apiAuto:true,embedded:false});
  state.datasets=nextDatasets;
  apiSyncStatus={...apiSyncStatus,available:true,loaded:true,generatedAt:payload.generatedAt,error:null,diagnostics:payload.diagnostics||{},syncMode:payload.syncMode||null,source:fromCache?'cache':'remote',updateAvailable:false};
  state.activePeriod=selected||'all';
  try{
    rebuildPeriodSelect();
    renderAll();
    if(!silent&&!fromCache)showMessage(`Данные обновлены: ${new Date(payload.generatedAt).toLocaleString('ru-RU')}. Seller API дополнен валидированным слоем комиссий СНГ; выручка из него не добавляется.`,'success');
  }catch(e){
    state.datasets=previousDatasets;
    apiSyncStatus={...previousStatus,available:true,loaded:false,loading:false,generatedAt:payload.generatedAt,error:`Ошибка применения API-данных: ${e?.message||e}`};
    try{rebuildPeriodSelect();renderAll()}catch{}
    throw new Error(`API расшифрован, но дашборд не смог применить данные: ${e?.message||e}`);
  }
}

async function loadRemoteAutoData(force=false){
  if(apiSyncStatus.loading)return;
  const hadLoaded=apiSyncStatus.loaded;
  const localGeneratedAt=apiSyncStatus.generatedAt;
  apiSyncStatus.loading=true;
  if(force)apiSyncStatus.error=null;
  renderSourceChips();
  try{
    const statusRes=await fetch(`${API_STATUS_URL}?t=${Date.now()}`,{cache:'no-store'});
    if(!statusRes.ok)throw new Error(`Статус API недоступен: HTTP ${statusRes.status}`);
    const status=await statusRes.json();
    apiSyncStatus.available=true;
    apiSyncStatus.error=null;

    if(!force&&hadLoaded&&localGeneratedAt&&status.generatedAt===localGeneratedAt){
      apiSyncStatus.generatedAt=localGeneratedAt;apiSyncStatus.loading=false;apiSyncStatus.updateAvailable=false;apiSyncStatus.source=apiSyncStatus.source==='cache'?'cache-fresh':apiSyncStatus.source;
      renderSourceChips();return;
    }

    const savedKey=sessionStorage.getItem(API_PW_SESSION)||localStorage.getItem(API_PW_REMEMBER)||'';
    if(hadLoaded&&!savedKey&&!force){
      apiSyncStatus.generatedAt=localGeneratedAt;apiSyncStatus.loading=false;apiSyncStatus.updateAvailable=true;apiSyncStatus.remoteGeneratedAt=status.generatedAt||null;
      renderSourceChips();return;
    }

    const version=encodeURIComponent(status.generatedAt||Date.now());
    const encRes=await fetch(`${API_DATA_URL}?v=${version}`,{cache:force?'reload':'force-cache'});
    if(!encRes.ok)throw new Error(`Файл данных API недоступен: HTTP ${encRes.status}`);
    const env=await encRes.json();

    let keyHex=savedKey;
    let remember=!!localStorage.getItem(API_PW_REMEMBER);
    if(!keyHex){
      const ans=await apiPasswordDialog();
      if(!ans){apiSyncStatus.loading=false;renderSourceChips();return}
      keyHex=normalizeDashboardKey(ans.password);remember=ans.remember;
    }

    let payload=null;
    try{payload=await decryptApiEnvelope(env,keyHex)}catch(e){
      sessionStorage.removeItem(API_PW_SESSION);localStorage.removeItem(API_PW_REMEMBER);
      apiSyncStatus.error='DASHBOARD_KEY не подошёл или файл повреждён';renderSourceChips();
      if(hadLoaded&&!force){apiSyncStatus.loading=false;apiSyncStatus.updateAvailable=true;return}
      showMessage('Не удалось расшифровать актуальные данные. Проверьте DASHBOARD_KEY.','error');
      const ans=await apiPasswordDialog();
      if(!ans?.password){apiSyncStatus.loading=false;renderSourceChips();return}
      keyHex=normalizeDashboardKey(ans.password);remember=ans.remember;
      try{payload=await decryptApiEnvelope(env,keyHex)}catch(e2){apiSyncStatus.error='DASHBOARD_KEY не совпадает с текущим файлом';showMessage('DASHBOARD_KEY не совпадает с текущим зашифрованным файлом.','error');apiSyncStatus.loading=false;renderSourceChips();return}
    }

    const normalizedKey=normalizeDashboardKey(keyHex);
    sessionStorage.setItem(API_PW_SESSION,normalizedKey);
    if(remember)localStorage.setItem(API_PW_REMEMBER,normalizedKey);
    try{
      applyApiPayload(payload,{fromCache:false,silent:false});
      writeApiCache(payload);
    }catch(e){console.error('Ozon API payload apply error:',e);apiSyncStatus.error=e?.message||String(e);showMessage(`Данные Ozon расшифрованы, но не применились: ${e?.message||e}`,'error')}
  }catch(e){
    console.warn('Ozon API auto sync:',e);
    if(hadLoaded){apiSyncStatus.loaded=true;apiSyncStatus.generatedAt=localGeneratedAt;apiSyncStatus.error=`Не удалось проверить обновление: ${e.message||e}`;if(force)showMessage(`Показан сохранённый снимок. Обновление не удалось: ${e.message||e}`,'error')}
    else{apiSyncStatus.loaded=false;apiSyncStatus.error=e.message||String(e);showMessage(`Ошибка загрузки данных Ozon: ${e.message||e}`,'error')}
  }finally{apiSyncStatus.loading=false;renderSourceChips()}
}

async function bootFastLoad(){
  const started=performance.now();
  apiSyncStatus.loading=true;
  try{
    const [cached]=await Promise.all([readApiCache(),loadEmbeddedReferenceData()]);
    if(cached?.payload){

/* ------------------------------ helpers ------------------------------ */
function norm(v){return String(v??'').toLowerCase().replace(/ё/g,'е').replace(/[\n\r]+/g,' ').replace(/\s+/g,' ').trim()}

}
function num(v){

function safe(v,d=0){return Number.isFinite(v)?v:d}
function pct(a,b){return b?100*a/b:null}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

function fmtNum(v,d=0){return Number.isFinite(v)?new Intl.NumberFormat('ru-RU',{maximumFractionDigits:d,minimumFractionDigits:d}).format(v):'нет данных'}

function parseRuDate(s){const m=String(s||'').match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`:null}
function canonicalDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return isoDate(v);
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;

async function parseWorkbook(file){

  // Group membership is stable. Preserve the latest non-empty classification

  const groupByArticle=new Map();
  const referenceVersions=state.datasets.filter(d=>d.type==='cost'||d.type==='rrp').sort((a,b)=>String(a.snapshot||a.importedAt).localeCompare(String(b.snapshot||b.importedAt)));

  function buildReferenceHistory(type,field){

  function referenceAt(history,article,date){

  const skuFinanceCoverageComplete=diag.skuFinanceCoverageComplete===true;
  const expenseKeys=['commission','acquiring','logistics','storage','ads','fines','returns','other'];

  // Finance gross/net remains an audit ledger in v8. P&L revenue is NOT taken from it.
  const directGross=sum(products,x=>safe(x.finance.grossRevenue));
  const directFinanceNet=sum(products,x=>x.finance.hasRows?safe(x.finance.rawNet):0);
  const grossResidual=financeGrossAccrued-directGross;
  const netResidual=financeNetAccrued-directFinanceNet;

  const orderExpenseKeys=['commission','acquiring','logistics','storage','ads','fines','returns','other'];
  function applyFinanceRowToEvents(candidates,r){
    if(!candidates.length)return;
    // An order-level charge is shared only by items inside that order. It is

  function allocateFinanceRowToProductEvents(o,r){

  }

  assignABC(products,'revenue','abcRevenue');
  assignABC(products,'operatingProfit','abcProfit');

  const operatingComplete=products.filter(x=>x.operatingProfit!=null);
  const operatingRevenue=sum(operatingComplete,x=>x.revenue);

  const marketplaceBuyoutExpenses=sum(finRows.filter(r=>r.manualSupplement===true),r=>expenseKeys.reduce((z,k)=>z+Math.max(0,safe(r[k])),0));
  const directOzonExpenses=sum(products,x=>safe(x.directOzonExpenses));
  const unallocatedOzonExpenses=expenseKeys.reduce((z,k)=>z+safe(unallocatedFinance[k]),0);
  const periodFinanceRows=finRows.filter(r=>r.financeScope==='period'||(!(r.article||r.sku)&&!r.orderNumber&&!r.postingNumber));

  const afterOzon=totalRevenue-financeOzonExpenses;

  const businessRoi=businessNetProfit!=null&&totalCogs?pct(businessNetProfit,totalCogs):null;

  // Shared expenses remain absent from order/SKU economics. Only at this summary
  // level are they split between business groups by delivered revenue.
  const groupDefs={
    consumables:{key:'consumables',label:'Расходные материалы',targetFactor:1.55,revenue:0,cogs:0,rrpBase:0,directOzon:0,missingBaseRevenue:0},

  let classifiedRevenue=0,unclassifiedRevenue=0;

  const combinedCash=businessGroups.every(g=>g.cashAfterAll!=null)?sum(businessGroups,g=>g.cashAfterAll):null;
  const groupCoverage=totalRevenue>0?pct(classifiedRevenue,totalRevenue):100;

  [...src].sort((a,b)=>safe(b.units)-safe(a.units)).filter(p=>safe(p.units)>1).slice(0,4).forEach(add);
  [...src].filter(p=>safe(p.realized?.returned)>0).sort((a,b)=>safe(b.realized.returned)-safe(a.realized.returned)).slice(0,3).forEach(add);
  [...src].sort((a,b)=>safe(a.operatingProfit)-safe(b.operatingProfit)).slice(0,4).forEach(add);
  [...src].sort((a,b)=>safe(b.operatingProfit)-safe(a.operatingProfit)).slice(0,4).forEach(add);

function matchesTableSearch(row,query,fields=['name','article','sku']){
  const q=norm(query);if(!q)return true;
  const qId=idNorm(query);
  const ids=fields.filter(f=>f==='article'||f==='sku');
  if(qId&&ids.some(f=>idNorm(row?.[f])===qId))return true;
  return fields.filter(f=>f!=='article'&&f!=='sku').some(f=>norm(row?.[f]).includes(q));
}
function filteredSorted(rows,st,fields=['name','article','sku']){

}

    ['Комиссия Ozon',fmtMoney(p.components.commission.value)],

 Поздний возврат ретроспективно уменьшает эту исходную продажу; дата возврата показана отдельно. Номер заказа и номер отправления — разные идентификаторы Ozon.</div>${productOrdersTable(p)}</div>`

   Drill-down is deliberately functional-first: a side drawer preserves the
   selected period and current tab, supports search/filter/sort/export, and a
   second click opens the SKU mini-dashboard without losing the parent list.
---------------------------------------------------------------------------- */
function drillPeriodText(){const p=currentModel?.period||currentModel?.businessPeriod;return p?`${dateLabel(p.start)} — ${dateLabel(p.end)}`:'весь доступный API-период'}
function drillStatsHtml(stats=[]){return stats.length?`<div class="drawer-stats">${stats.map(x=>`<div class="drawer-stat"><div class="ds-label">${escapeHtml(x.label)}</div><div class="ds-value ${x.cls||''}">${x.raw??escapeHtml(String(x.value??''))}</div>${x.sub?`<div class="ds-sub">${escapeHtml(x.sub)}</div>`:''}</div>`).join('')}</div>`:''}
function productOzonCost(p){return safe(p.revenue)-safe(p.netAfterOzon)}
function productRrpTarget(p){return Number.isFinite(p.rrp)&&p.units!=null?p.rrp*p.units*.92:null}
function productPreExternalGap(p){const t=productRrpTarget(p);return t==null?null:safe(p.netAfterOzon)-t}
function attentionProducts(){
  const map=new Map();
  for(const p of currentModel.stockStats.rows.filter(x=>x.status==='Критично'))map.set(p.key,{...p,attentionReason:'Критичный остаток'});
  for(const p of currentModel.operatingComplete.filter(x=>x.operatingProfit<0)){
    const old=map.get(p.key);map.set(p.key,{...p,attentionReason:old?`${old.attentionReason} + Убыток`:'Убыток'});
  }
  return [...map.values()];
}
function baseProductColumns(){return[
  {key:'article',label:'Артикул',fmt:p=>escapeHtml(p.article||p.sku||'—'),html:true},
  {key:'name',label:'Товар',fmt:p=>`<span class="linkish" data-product-drill="${escapeHtml(p.key)}">${escapeHtml(p.name||'Без названия')}</span>`,html:true,cls:'name'},

]}

function drillValueForSort(p,key){
  if(key==='ozonCost')return productOzonCost(p);if(key==='rrpTarget')return productRrpTarget(p);if(key==='preExternalGap')return productPreExternalGap(p);if(key==='adsValue')return safe(p.components?.ads?.value);return p[key];

function sortDrillRows(rows,key,dir){return [...rows].sort((a,b)=>{let x=drillValueForSort(a,key),y=drillValueForSort(b,key);if(x==null)x=dir>0?Infinity:-Infinity;if(y==null)y=dir>0?Infinity:-Infinity;if(typeof x==='string')return dir*x.localeCompare(String(y),'ru');return dir*(safe(x)-safe(y))})}
function drillFilteredRows(def){
  const q=norm(drillUI.search||'');
  const numericQuery=/^\d+$/.test(q);
  return def.rows.filter(p=>{
    if(drillUI.category&&p.category!==drillUI.category)return false;
    if(!q)return true;
    const article=norm(p.article??''),sku=norm(p.sku??'');

    return norm(`${p.name??''} ${p.article??''} ${p.sku??''}`).includes(q);
  });

  const m=currentModel,e=m.externalExpenses;const rows=[['Выручка доставленных заказов',m.totalRevenue],['Все списания Ozon',-m.financeOzonExpensesGross],['Плюс возвраты / сторно Ozon',m.financeOzonRefunds],['Чистые расходы Ozon',-m.financeOzonExpenses],['После услуг Ozon',m.afterOzon],['Минус внешние расходы',-safe(e?.totalKnown)],['Управленческий остаток',m.managementRemainder??m.managementRemainderKnown],['Минус закупочную стоимость',-m.totalCogs],['Прибыль до УСН',m.profitBeforeTax],['Минус оценка УСН',m.estimatedTax!=null?-m.estimatedTax:null],['Результат после УСН',m.businessNetProfit]];
  return `${drillStatsHtml(def.stats)}${def.note?`<div class="drawer-note">${escapeHtml(def.note)}</div>`:''}<div class="table-wrap"><table class="table" style="min-width:620px"><thead><tr><th>Этап</th><th class="num">Сумма</th></tr></thead><tbody>${rows.map(([n,v])=>`<tr><td>${escapeHtml(n)}</td><td class="num ${v!=null&&v<0?'negative':''}">${v==null?'нет данных':fmtMoney(v)}</td></tr>`).join('')}</tbody></table></div><h3 style="margin-top:16px">Начисления Ozon без связи с заказом</h3><div class="muted tiny" style="margin-bottom:8px">Показаны отдельно и не распределены между заказами или SKU.</div>${periodChargesTable(m.periodChargeRows,m.periodOzonExpenses)}`;
}
function renderGroupsDrill(def){
  const rows=currentModel.businessGroups||[];
  return `${drillStatsHtml(def.stats)}${def.note?`<div class="drawer-note">${escapeHtml(def.note)}</div>`:''}<div class="table-wrap"><table class="table" style="min-width:980px"><thead><tr><th>Группа</th><th class="num">Выручка</th><th class="num">Прямые расходы Ozon</th><th class="num">Общие расходы группы</th><th class="num">После всех расходов</th><th class="num">База норматива</th><th class="num">Цель</th><th class="num">Коэффициент</th><th class="num">Выполнение</th></tr></thead><tbody>${rows.map(g=>`<tr><td class="name"><b>${escapeHtml(g.label)}</b><div class="muted tiny">${g.key==='consumables'?'норматив 1,50–1,55 к закупке':'норматив 0,92 к РРЦ'}</div></td><td class="num">${fmtMoney(g.revenue)}</td><td class="num">${fmtMoney(g.directOzon)}</td><td class="num">${fmtMoney(g.shared??g.sharedKnown)}</td><td class="num">${g.cashAfterAll!=null?fmtMoney(g.cashAfterAll):'неполно'}</td><td class="num">${fmtMoney(g.targetBase)}</td><td class="num">${fmtMoney(g.targetAmount)}</td><td class="num ${g.complete?'':'warning'}">${g.coefficient!=null?g.coefficient.toFixed(3)+'×':'—'}</td><td class="num">${fmtPct(g.attainment)}</td></tr>`).join('')}</tbody></table></div>${currentModel.unclassifiedRevenue?`<div class="notice error" style="margin-top:12px">Не классифицирована выручка ${fmtMoney(currentModel.unclassifiedRevenue)}. Добавьте в файл 1С/Excel колонку «Группа товаров» со значениями «Расходные материалы» или «Товары».</div>`:''}`;
}
function renderProductDrill(def){const p=def.product;if(!p)return'<div class="empty">Товар не найден в текущем периоде.</div>';return `${drillStatsHtml(def.stats)}<div class="drawer-product-title"><div><div class="article">Артикул ${escapeHtml(p.article||'—')} · SKU ${escapeHtml(p.sku||'—')}</div><div class="muted tiny">${escapeHtml(p.category||'Без категории')} · ${escapeHtml(p.brand||'')}</div></div></div>${productDetail(p)}`}
function renderDrilldown(){
  const cur=drillStack.at(-1);if(!cur)return;const def=drillDefinition(cur.type,cur.payload);$('#drawerTitle').textContent=def.title;$('#drawerSubtitle').textContent=def.subtitle||`Период: ${drillPeriodText()}`;$('#drawerBack').classList.toggle('hidden',drillStack.length<=1);$('#drawerExport').classList.toggle('hidden',['tax','management','business','groups','external','product'].includes(def.kind));
  let html='';if(def.kind==='external')html=renderExternalDrill(def);else if(def.kind==='categories')html=renderCategoriesDrill(def);else if(def.kind==='signals')html=renderSignalsDrill(def);else if(def.kind==='groups')html=renderGroupsDrill(def);else if(def.kind==='tax'||def.kind==='management'||def.kind==='business')html=renderBusinessDrill(def);else if(def.kind==='product')html=renderProductDrill(def);else html=`${drillStatsHtml(def.stats)}${def.note?`<div class="drawer-note">${escapeHtml(def.note)}</div>`:''}${renderDrillProductTable(def)}`;
  $('#drawerBody').innerHTML=html;bindDrillControls(def);
}
let drillSearchTimer=null;
function bindDrillResultControls(def){
  $$('[data-drill-sort]').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.drillSort;if(!k)return;drillUI.dir=drillUI.sort===k?-drillUI.dir:-1;drillUI.sort=k;refreshDrillProductResults(def)}));
  $('#drillPrev')?.addEventListener('click',()=>{drillUI.page--;refreshDrillProductResults(def)});$('#drillNext')?.addEventListener('click',()=>{drillUI.page++;refreshDrillProductResults(def)});
}
function bindDrillControls(def){
  $('#drillSearch')?.addEventListener('input',e=>{
    drillUI.search=e.target.value;drillUI.page=1;
    clearTimeout(drillSearchTimer);
    drillSearchTimer=setTimeout(()=>refreshDrillProductResults(def),120);
  });
  $('#drillCategory')?.addEventListener('change',e=>{drillUI.category=e.target.value;drillUI.page=1;refreshDrillProductResults(def)});
  bindDrillResultControls(def);
  $('#drillGoSettings')?.addEventListener('click',()=>{closeDrilldown();activeTab='settings';$$('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab==='settings'));$$('.tab-pane').forEach(p=>p.classList.toggle('active',p.id==='tab-settings'));renderSettings();window.scrollTo({top:document.querySelector('#tabs')?.offsetTop||0,behavior:'smooth'})});
}
function exportCurrentDrilldown(){
  const cur=drillStack.at(-1);if(!cur||!window.XLSX)return;const def=drillDefinition(cur.type,cur.payload);if(def.kind!=='products'&&def.kind!=='signals'&&def.kind!=='categories')return;
  let rows=[];
  if(cur.type==='missingCost')rows=def.rows.map(p=>({'Артикул Ozon':p.article||'',SKU:p.sku||'','Товар':p.name||'','Категория':p.category||'','Текущая цена Ozon':p.currentPrice,'Закупочная цена':p.cost,'Проблема':p.costConflict?'конфликт закупочных цен':'нет закупочной цены'}));
  else if(cur.type==='missingRrp')rows=def.rows.map(p=>({'Артикул Ozon':p.article||'',SKU:p.sku||'','Товар':p.name||'','Категория':p.category||'','Текущая цена Ozon':p.currentPrice,'РРЦ':p.rrp,'Проблема':p.rrpSource==='conflict'?'конфликт РРЦ':'нет РРЦ'}));
  else if(def.kind==='products')rows=def.rows.map(p=>({'Артикул':p.article||'',SKU:p.sku||'','Товар':p.name||'','Категория':p.category||'','РРЦ, ₽/шт.':p.rrp,'РРЦ реализации':Number.isFinite(p.rrp)&&p.units!=null?p.rrp*p.units:null,'Net, шт.':p.units,'Выручка':p.revenue,'После Ozon':p.netAfterOzon,'Расходы Ozon':productOzonCost(p),'Закупочная цена, ₽/шт.':p.cost,'Закупочная стоимость':p.cogs,'Товарная прибыль':p.operatingProfit,'Маржа, %':p.operatingMargin,'ROI, %':p.operatingRoi,'Остаток':p.stock,'Дней запаса':p.daysToZero===Infinity?null:p.daysToZero,'ABC прибыль':p.abcProfit,'ABC выручка':p.abcRevenue,'Причина внимания':p.attentionReason||'','Заказы Ozon (номер | дата | отправление)':orderSummaryText(p),'Вклад в общий норматив':productRrpTarget(p),'Вклад в разрыв до внешних расходов':productPreExternalGap(p)}));
  else if(def.kind==='signals')rows=currentModel.signals.map(x=>({'Артикул':x.product.article,'Товар':x.product.name,'Категория':x.product.category,'Сигнал':x.type,'Почему':x.detail,'Потенциал, ₽':x.potential}));
  else rows=currentModel.categories.map(x=>({'Категория':x.category,'Товаров':x.count,'Выручка':x.revenue,'Товарная прибыль':x.profit,'Маржа, %':x.margin}));
  const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Детализация');
  if(def.kind==='products'&&!['missingCost','missingRrp'].includes(cur.type)){
    const keys=new Set(def.rows.map(p=>p.key)),orders=(currentModel.orderRows||[]).filter(r=>keys.has(r.productKey)).map(orderExportRow);
    XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(orders),'Заказы Ozon');
  }
  const fn=cur.type==='missingCost'?'ozon_missing_purchase_prices.xlsx':cur.type==='missingRrp'?'ozon_missing_rrp.xlsx':`ozon_detail_${cur.type}_${(currentModel.period?.start||'all')}_${(currentModel.period?.end||'all')}.xlsx`;XLSX.writeFile(wb,fn);
}

/* ------------------------------- charts ------------------------------- */
function destroyChart(id){if(charts[id]){charts[id].destroy();delete charts[id]}}
function chart(id,config){destroyChart(id);const el=document.getElementById(id);if(!el||!window.Chart)return;charts[id]=new Chart(el,config)}
const chartDefaults={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#aeb8cb'}}},scales:{x:{ticks:{color:'#8f9ab0'},grid:{color:'rgba(255,255,255,.05)'}},y:{ticks:{color:'#8f9ab0'},grid:{color:'rgba(255,255,255,.05)'}}}};
function renderChartsForTab(tab){requestAnimationFrame(()=>{if(tab==='overview')renderOverviewCharts();if(tab==='ads')renderFunnelChart();if(tab==='stock')renderStockChart()})}
function renderOverviewCharts(){
  const m=currentModel,ext=m.externalExpenses,note=$('#waterfallNote');
  if(note)note.textContent=`Источники Ozon: выручка — фактические доставки; расходы — Finance API по дате начисления. Нитка: выручка доставок → расходы Ozon → внешние расходы → управленческий остаток → закупка → УСН. Норматив РРЦ × 0,92 показан отдельным KPI и не вычитается из прибыли.${ext?.missingHired.length?' Наёмная логистика неполная: '+ext.missingHired.join(', ')+'.':''}`;
  if(!m.financeDs.length){
    $('#waterfallEmpty')?.classList.remove('hidden');if($('#waterfallEmpty'))$('#waterfallEmpty').textContent='Нет финансового ledger Ozon API.';destroyChart('waterfallChart');
  }else{
    $('#waterfallEmpty')?.classList.add('hidden');
    const rev=m.totalRevenue,ozonNet=m.afterOzon,ozonCost=m.financeOzonExpenses;
    let cur=rev;const labels=['Выручка'],data=[[0,rev]];
    const step=(label,val)=>{const v=safe(val);labels.push(label);data.push([cur-v,cur]);cur-=v};
    step('Услуги Ozon',ozonCost);
    step('Репрайсер',ext?.repricer);
    step('Премия магазинам',ext?.storeBonus);
    if(ext?.complete)step('Наёмная логистика',ext.hiredKnown);
    else{labels.push('Остаток до неизвестной логистики');data.push([0,cur])}
    if(ext?.complete){
      labels.push('Управленческий остаток');data.push([0,cur]);
      step('Закупочная стоимость',m.totalCogs);
      if(m.estimatedTax!=null)step(`Оценка УСН ${fmtPct(m.taxRate)}`,m.estimatedTax);
      labels.push('Результат после УСН');data.push([0,safe(m.businessNetProfit)]);
    }
    chart('waterfallChart',{type:'bar',data:{labels,datasets:[{data,borderWidth:0,borderRadius:5}]},options:{...chartDefaults,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>fmtMoney(Math.abs(ctx.raw[1]-ctx.raw[0]))}}}}});
  }
  if(!state.snapshots.length){$('#trendEmpty')?.classList.remove('hidden');if($('#trendEmpty'))$('#trendEmpty').textContent='Срезов пока нет.';destroyChart('trendChart')}
  else chart('trendChart',{type:'line',data:{labels:state.snapshots.map(s=>new Date(s.ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})),datasets:[{label:'Выручка, ₽',data:state.snapshots.map(s=>s.revenue)},{label:'Результат после УСН, ₽',data:state.snapshots.map(s=>s.profit)}]},options:chartDefaults});
  const abc=['A','B','C'].map(g=>sum(m.complete.filter(p=>p.abcProfit===g),p=>p.cleanProfit));
  if(!m.complete.length){$('#abcEmpty')?.classList.remove('hidden');destroyChart('abcChart')}
  else chart('abcChart',{type:'bar',data:{labels:['A','B','C'],datasets:[{label:'Товарная прибыль, ₽',data:abc}]},options:{...chartDefaults,plugins:{legend:{display:false}}}});
}
function renderFunnelChart(){const m=currentModel;if(!m.funnelDs.length){destroyChart('funnelChart');return}const data=[sum(m.products,p=>p.sales.impressions),sum(m.products,p=>p.sales.visits),sum(m.products,p=>p.sales.carts),sum(m.products,p=>p.sales.ordered),sum(m.products,p=>p.sales.delivered)];chart('funnelChart',{type:'bar',data:{labels:['Показы','Визиты','В корзину','Заказано','Доставлено'],datasets:[{label:'Количество',data}]},options:{...chartDefaults,indexAxis:'y',plugins:{legend:{display:false}}}})}
function renderStockChart(){const r=currentModel.stockStats.rows;const active=r.filter(x=>x.status!=='Нет продаж');const bins=[active.filter(x=>Number.isFinite(x.daysToZero)&&x.daysToZero<7).length,active.filter(x=>Number.isFinite(x.daysToZero)&&x.daysToZero>=7&&x.daysToZero<14).length,active.filter(x=>Number.isFinite(x.daysToZero)&&x.daysToZero>=14&&x.daysToZero<30).length,active.filter(x=>Number.isFinite(x.daysToZero)&&x.daysToZero>=30&&x.daysToZero<60).length,active.filter(x=>Number.isFinite(x.daysToZero)&&x.daysToZero>=60).length,r.filter(x=>x.status==='Нет продаж').length];chart('stockChart',{type:'bar',data:{labels:['<7','7–14','14–30','30–60','>60','нет продаж'],datasets:[{label:'Товаров',data:bins}]},options:{...chartDefaults,plugins:{legend:{display:false}}}})}

/* ------------------------------- events ------------------------------- */
$('#fileInput').addEventListener('change',e=>{if(e.target.files?.length)ingestFiles([...e.target.files]);e.target.value=''})
$('#periodSelect').addEventListener('change',e=>{state.activePeriod=e.target.value;persistState();syncPeriodDateInputs();renderAll()})
$('#applyPeriodBtn').addEventListener('click',applyCustomPeriod)
$('#periodFrom').addEventListener('keydown',e=>{if(e.key==='Enter')applyCustomPeriod()})
$('#periodTo').addEventListener('keydown',e=>{if(e.key==='Enter')applyCustomPeriod()})
$('#saveSnapshotBtn').addEventListener('click',()=>{const m=currentModel;const coverage=m.cogsCoverage||0;state.snapshots.push({ts:new Date().toISOString(),period:state.activePeriod,revenue:m.totalRevenue,profit:m.businessNetProfit,margin:m.businessMargin,coverage,rrpDelta:m.rrpDelta,rrpAttainment:m.rrpAttainment});if(state.snapshots.length>100)state.snapshots=state.snapshots.slice(-100);persistState();renderOverview();if(activeTab==='overview')renderOverviewCharts();showMessage(`Срез сохранён. Покрытие P&L ${fmtPct(coverage)}; норматив РРЦ × 0,92 ${m.rrpDelta==null?'предварительный':m.rrpDelta>=0?'выполнен':'не выполнен'}.`,'success')})
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;activeTab=b.dataset.tab;$$('.tab-btn').forEach(x=>x.classList.toggle('active',x===b));$$('.tab-pane').forEach(x=>x.classList.toggle('active',x.id===`tab-${activeTab}`));if(currentModel)renderActiveTab()})
const dz=$('#dropZone');['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>{const files=[...e.dataTransfer.files].filter(f=>/\.xlsx?$/i.test(f.name));if(files.length)ingestFiles(files)})


// Drill-down event delegation: works for content that is re-rendered dynamically.
document.addEventListener('click',e=>{
  const direct=e.target.closest('[data-drill]');if(direct){openDrilldown(direct.dataset.drill);return}
  const prod=e.target.closest('[data-product-drill]');if(prod){openDrilldown('product',{key:prod.dataset.productDrill});return}
  const cat=e.target.closest('[data-category-drill]');if(cat){openDrilldown('category',{category:cat.dataset.categoryDrill});return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#detailDrawer').classList.contains('hidden'))closeDrilldown();if((e.key==='Enter'||e.key===' ')&&e.target?.matches?.('.kpi[data-drill]')){e.preventDefault();openDrilldown(e.target.dataset.drill)}});
$('#drawerClose').addEventListener('click',closeDrilldown);$('#detailBackdrop').addEventListener('click',closeDrilldown);$('#drawerBack').addEventListener('click',backDrilldown);$('#drawerExport').addEventListener('click',exportCurrentDrilldown);

// v9.3 Fast Load: cached decrypted dashboard state + cached standalone 1C reference first, then a tiny status check and background refresh.
bootFastLoad();
</script>
