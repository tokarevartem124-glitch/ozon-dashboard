name: Temporary compensation API check

on:
  push:
    paths:
      - ".github/workflows/temp-compensation-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Query Ozon API
        run: node scripts/temp-compensation-check.mjs
        env:
          OZON_CLIENT_ID: "${{ secrets.OZON_CLIENT_ID }}"
          OZON_API_KEY: "${{ secrets.OZON_API_KEY }}"
      - name: Upload encrypted result
        uses: actions/upload-artifact@v4
        with:
          name: compensation-check-encrypted
          path: diagnostic-output/compensation-check.enc.json
          retention-days: 1
