name: "Encrypted CIS API diagnostic"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cis-api-export.yml"
      - "scripts/cis-api-export.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch and encrypt CIS data
        run: node scripts/cis-api-export.mjs
        env:
          OZON_CLIENT_ID: "${{ secrets.OZON_CLIENT_ID }}"
          OZON_API_KEY: "${{ secrets.OZON_API_KEY }}"
          EXPORT_PUBLIC_KEY_B64: ""

      - name: Upload encrypted diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: cis-api-export-encrypted
          path: diagnostic-output/cis-api-export.enc.json
          retention-days: 1
          if-no-files-found: error
