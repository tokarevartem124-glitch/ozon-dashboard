name: "Ozon dashboard sync + deploy"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Sync mode"
        required: true
        default: "fast"
        type: choice
        options:
          - fast
          - daily

  push:
    branches:
      - main
    paths:
      - "index.html"
      - "ozon-sync.mjs"
      - ".github/workflows/ozon-sync.yml"

  schedule:
    - cron: "17 * * * *"
    - cron: "37 2 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# IMPORTANT: never cancel a running rebuild. A scheduled hourly refresh may start
# while a full SKU-finance backfill is still running; it must wait in the queue.
concurrency:
  group: "ozon-pages-sync"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Decide sync mode
        id: sync_mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "37 2 * * *" ]; then
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fast" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch and encrypt Ozon data
        run: node ozon-sync.mjs
        env:
          OZON_CLIENT_ID: "${{ secrets.OZON_CLIENT_ID }}"
          OZON_API_KEY: "${{ secrets.OZON_API_KEY }}"
          DASHBOARD_KEY: "${{ secrets.DASHBOARD_KEY }}"
          SYNC_MODE: "${{ steps.sync_mode.outputs.mode }}"
          PREVIOUS_DATA_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/ozon-data.enc.json"
          FINANCE_LOOKBACK_DAYS: "3"
          ANALYTICS_MAX_CATCHUP_DAYS: "7"
          ANALYTICS_PAGE_DELAY_MS: "65000"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
