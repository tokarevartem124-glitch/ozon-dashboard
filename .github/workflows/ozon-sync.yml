name: "Ozon dashboard sync + deploy"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and encrypt Ozon data
        run: node ozon-sync.mjs
        env:
          OZON_CLIENT_ID: "${{ secrets.OZON_CLIENT_ID }}"
          OZON_API_KEY: "${{ secrets.OZON_API_KEY }}"
          DASHBOARD_PASSWORD: "${{ secrets.DASHBOARD_PASSWORD }}"
          OZON_HISTORY_DAYS: "120"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
